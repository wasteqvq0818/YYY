name: build-xiugou

# 触发：push 到任何分支，或在网页上手动点 Run workflow
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          # 越狱类型不确定就两个都编：rootful 用 /Library/...，rootless 用 /var/jb/Library/...
          - scheme: rootful
            env: ''
          - scheme: rootless
            env: 'THEOS_PACKAGE_SCHEME=rootless'

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 缓存 theos（第二次跑就很快）
        uses: actions/cache@v4
        with:
          path: |
            ~/theos
            ~/theos/sdks
          key: theos-macos14-v3

      - name: 安装 Theos
        run: |
          set -e
          if [ ! -d "$HOME/theos" ]; then
            git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          fi
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"
          ls "$HOME/theos" | head

      - name: 安装 iOS SDK（只拉一个，sparse checkout）
        run: |
          set -e
          mkdir -p "$HOME/theos/sdks"
          if [ ! -d "$HOME/theos/sdks/iPhoneOS16.5.sdk" ]; then
            cd /tmp
            git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git sdks
            cd sdks
            git sparse-checkout set iPhoneOS16.5.sdk
            cp -R iPhoneOS16.5.sdk "$HOME/theos/sdks/"
          fi
          ls -d "$HOME/theos/sdks"/*.sdk

      - name: 编译
        env:
          THEOS_SCHEME_ENV: ${{ matrix.env }}
        run: |
          set -e
          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"
          if [ -n "$THEOS_SCHEME_ENV" ]; then
            export $THEOS_SCHEME_ENV
            echo "打包模式: rootless"
          else
            echo "打包模式: rootful"
          fi

          make clean || true
          make package FINALPACKAGE=1 DEBUG=0
          mkdir -p artifacts
          cp -v packages/*.deb artifacts/ || true
          ls -lh artifacts/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: xiugou-${{ matrix.scheme }}
          path: artifacts/*.deb
          if-no-files-found: error
