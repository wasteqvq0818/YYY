name: build-dylib

# TrollStore 环境：不需要 Substrate / 越狱 → 不需要 theos 打包 .deb
# 直接用 clang 交叉编译出 XiuGou.dylib，再用"巨魔注入器"（TrollFools 类）注入游戏
#
# 触发：push 到任何分支，或网页上点 Run workflow

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装交叉编译工具链
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            clang lld llvm make git curl xz-utils
          echo "--- clang ---"
          clang --version | head -1
          echo "--- 链接器 ---"
          which ld64.lld ld.lld || true

      - name: 缓存 iOS SDK
        uses: actions/cache@v4
        with:
          path: ~/sdks
          key: ios-sdk-16.5-v1

      - name: 下载 iOS SDK
        run: |
          set -e
          mkdir -p "$HOME/sdks"
          if [ ! -d "$HOME/sdks/iPhoneOS16.5.sdk" ]; then
            cd /tmp
            git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git sdks
            cd sdks
            git sparse-checkout set iPhoneOS16.5.sdk
            cp -R iPhoneOS16.5.sdk "$HOME/sdks/"
          fi
          ls -d "$HOME/sdks"/*.sdk
          echo "SDKROOT=$HOME/sdks/iPhoneOS16.5.sdk" >> "$GITHUB_ENV"

      - name: 编译 XiuGou.dylib
        run: |
          set -e
          SDK="$HOME/sdks/iPhoneOS16.5.sdk"

          # 先单独编 C 文件（TOSBoard.c 是 C99，不能当 C++ 编）
          clang -target arm64-apple-ios15.0 -isysroot "$SDK" -O2 -c TOSBoard.c -o TOSBoard.o
          echo "TOSBoard.o 编好"

          # ObjC / ObjC++ 源文件
          SRCS=$(ls *.m *.mm 2>/dev/null)
          echo "源文件: $SRCS"

          clang++ -dynamiclib \
            -target arm64-apple-ios15.0 \
            -isysroot "$SDK" \
            --ld-path=/usr/bin/ld64.lld \
            -Wl,-arch,arm64 \
            -Wl,-platform_version,ios,15.0,16.5 \
            -Wl,-syslibroot,"$SDK" \
            -fobjc-arc \
            -O2 \
            -Wno-everything \
            -framework Foundation \
            -framework UIKit \
            -framework QuartzCore \
            -framework CoreGraphics \
            -install_name "@executable_path/Frameworks/XiuGou.dylib" \
            $SRCS TOSBoard.o \
            -o XiuGou.dylib

          echo "--- 产物 ---"
          ls -lh XiuGou.dylib
          file XiuGou.dylib
          echo "--- 依赖 ---"
          llvm-objdump --macho --dylibs-used XiuGou.dylib 2>/dev/null | head -20 || true

      - name: 签名
        run: |
          set -e
          URL=$(curl -sL https://api.github.com/repos/ProcursusTeam/ldid/releases/latest \
                | grep -oE '"browser_download_url":[[:space:]]*"[^"]*"' \
                | sed -E 's/.*"(https[^"]+)".*/\1/' | grep -i linux | head -1)
          echo "ldid: $URL"
          if [ -n "$URL" ]; then
            curl -sL -o /tmp/ldid "$URL" && chmod +x /tmp/ldid && sudo mv /tmp/ldid /usr/local/bin/ldid
            ldid -S XiuGou.dylib && echo "已用 ldid 签名"
          else
            echo "拿不到 ldid；TrollStore 注入通常也接受未签名 dylib，继续"
          fi

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: XiuGou-dylib
          path: XiuGou.dylib
          if-no-files-found: error

      - name: 失败时输出诊断
        if: failure()
        run: |
          echo "=== 环境 ==="
          clang --version || true
          which ld64.lld ld.lld clang++ || true
          echo "=== SDK ==="
          ls -d "$HOME/sdks"/*.sdk 2>/dev/null || echo "无 SDK"
