name: build-xiugou

# 触发：push 到任何分支，或在网页上手动点 Run workflow
on:
  push:
  workflow_dispatch:

jobs:
  build:
    # 用 Ubuntu 而不是 macOS：
    #   macOS runner 按 10 倍扣免费额度，免费账户容易直接拿不到 runner（表现为秒 cancelled、steps=0）
    #   Linux 上 theos 交叉编译 iOS tweak 是成熟路线，额度充足
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 越狱类型不确定就两个都编
          - scheme: rootful
            pkg_scheme: ''
          - scheme: rootless
            pkg_scheme: 'rootless'

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            clang lld make git curl xz-utils libtinfo6 libncurses6 fakeroot \
            libplist-utils
          clang --version | head -1
          ld64.lld --version 2>/dev/null | head -1 || echo "ld64.lld 未就绪（theos 会用自带链接器）"

      - name: 缓存 theos
        uses: actions/cache@v4
        with:
          path: |
            ~/theos
          key: theos-linux-${{ runner.os }}-v4

      - name: 安装 Theos
        run: |
          set -e
          if [ ! -d "$HOME/theos" ]; then
            git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          fi
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"
          ls "$HOME/theos"

      - name: 安装 iOS SDK（sparse，只拉一个）
        run: |
          set -e
          mkdir -p "$HOME/theos/sdks"
          if [ ! -d "$HOME/theos/sdks/iPhoneOS16.5.sdk" ]; then
            cd /tmp
            git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git sdks
            cd sdks
            git sparse-checkout set iPhoneOS16.5.sdk
            cp -R iPhoneOS16.5.sdk "$HOME/theos/sdks/"
          fi
          ls -d "$HOME/theos/sdks"/*.sdk

      - name: 环境自检
        run: |
          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"
          echo "THEOS=$THEOS"
          which make clang ldid 2>/dev/null || true
          ls "$THEOS/bin" | head -20
          echo "--- 尝试识别 SDK ---"
          ls "$THEOS/sdks"

      - name: 编译
        env:
          PKG_SCHEME: ${{ matrix.pkg_scheme }}
        run: |
          set -e
          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"
          export DEBUG=0
          if [ -n "$PKG_SCHEME" ]; then
            export THEOS_PACKAGE_SCHEME="$PKG_SCHEME"
            echo "打包模式: rootless (/var/jb)"
          else
            echo "打包模式: rootful"
          fi

          make clean || true
          make package FINALPACKAGE=1 2>&1 | tee /tmp/build.log

          mkdir -p artifacts
          cp -v packages/*.deb artifacts/
          ls -lh artifacts/

      - name: 失败时输出编译日志
        if: failure()
        run: |
          echo "===== 编译日志尾部 ====="
          tail -n 120 /tmp/build.log 2>/dev/null || echo "无日志"

      - name: 上传产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xiugou-${{ matrix.scheme }}
          path: artifacts/*.deb
          if-no-files-found: error
