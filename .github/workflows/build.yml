name: build-xiugou

# 触发：push 到任何分支，或在网页上手动点 Run workflow
on:
  push:
  workflow_dispatch:

jobs:
  build:
    # 用 Ubuntu 而不是 macOS：
    #   macOS runner 按 10 倍扣免费额度，免费账户容易直接拿不到 runner（表现为秒 cancelled、steps=0）
    #   Linux 上 theos 交叉编译 iOS tweak 是成熟路线，额度充足
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 越狱类型不确定就两个都编
          - scheme: rootful
            pkg_scheme: ''
          - scheme: rootless
            pkg_scheme: 'rootless'

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            clang lld llvm make git curl xz-utils libtinfo6 libncurses6 fakeroot \
            libplist-utils
          clang --version | head -1
          ld64.lld --version 2>/dev/null | head -1 || echo "ld64.lld 未就绪（theos 会用自带链接器）"

      - name: 缓存 theos
        uses: actions/cache@v4
        with:
          path: |
            ~/theos
          key: theos-linux-${{ runner.os }}-v4

      - name: 安装 Theos
        run: |
          set -e
          if [ ! -d "$HOME/theos" ]; then
            git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          fi
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"
          ls "$HOME/theos"

      - name: 伪装 iOS 工具链（用系统 clang）
        run: |
          set -e
          # theos 在 Linux 上硬编码查找 $THEOS/toolchain/linux/iphone/bin/clang
          # 新版 theos 不再分发 toolchain，所以把系统 clang/llvm 符号链过去
          TC="$HOME/theos/toolchain/linux/iphone/bin"
          mkdir -p "$TC"
          install_one() {
            dst="$TC/$1"; src="$2"
            if [ -x "$src" ]; then ln -sf "$src" "$dst"; else echo "缺 $src"; fi
          }
          install_one clang        "$(command -v clang)"
          install_one clang++      "$(command -v clang++)"
          install_one as           "$(command -v clang)"
          install_one ld           "$(command -v ld64.lld || command -v ld.lld)"
          install_one ar           "$(command -v llvm-ar)"
          install_one ranlib       "$(command -v llvm-ranlib)"
          install_one nm           "$(command -v llvm-nm)"
          install_one strip        "$(command -v llvm-strip)"
          install_one objcopy      "$(command -v llvm-objcopy)"
          install_one objdump      "$(command -v llvm-objdump)"
          echo "--- 工具链内容 ---"
          ls -l "$TC"
          echo "--- 验证 clang 能编 iOS target ---"
          echo 'int main(void){return 0;}' > /tmp/t.c
          "$TC/clang" -target arm64-apple-ios15.0 -c /tmp/t.c -o /tmp/t.o && echo "clang OK"
          file /tmp/t.o || true

      - name: 安装 ldid（Linux 版，签名用）
        run: |
          set -e
          if command -v ldid >/dev/null 2>&1; then ldid -h | head -2; exit 0; fi
          URL=$(curl -sL https://api.github.com/repos/ProcursusTeam/ldid/releases/latest \
                | grep -oE '"browser_download_url":[[:space:]]*"[^"]*"' \
                | sed -E 's/.*"(https[^"]+)".*/\1/' \
                | grep -iE 'linux' | head -1)
          echo "下载: $URL"
          if [ -n "$URL" ]; then
            curl -sL -o /tmp/ldid "$URL" && chmod +x /tmp/ldid && sudo mv /tmp/ldid /usr/local/bin/ldid
          fi
          if command -v ldid >/dev/null 2>&1; then
            echo "ldid 就绪"; ldid -h 2>&1 | head -2
          else
            echo "ldid 装不上，做一个空壳让 theos 继续（越狱环境通常能加载未签名 dylib）"
            printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/ldid >/dev/null
            sudo chmod +x /usr/local/bin/ldid
          fi
      - name: 安装 iOS SDK（sparse，只拉一个）
        run: |
          set -e
          mkdir -p "$HOME/theos/sdks"
          if [ ! -d "$HOME/theos/sdks/iPhoneOS16.5.sdk" ]; then
            cd /tmp
            git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git sdks
            cd sdks
            git sparse-checkout set iPhoneOS16.5.sdk
            cp -R iPhoneOS16.5.sdk "$HOME/theos/sdks/"
          fi
          ls -d "$HOME/theos/sdks"/*.sdk

      - name: 环境自检
        run: |
          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"
          echo "THEOS=$THEOS"
          which make clang ldid 2>/dev/null || true
          ls "$THEOS/bin" | head -20
          echo "--- 尝试识别 SDK ---"
          ls "$THEOS/sdks"

      - name: 编译
        env:
          PKG_SCHEME: ${{ matrix.pkg_scheme }}
        run: |
          set -e
          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"
          export DEBUG=0
          if [ -n "$PKG_SCHEME" ]; then
            export THEOS_PACKAGE_SCHEME="$PKG_SCHEME"
            echo "打包模式: rootless (/var/jb)"
          else
            echo "打包模式: rootful"
          fi

          make clean || true
          make package FINALPACKAGE=1 2>&1 | tee /tmp/build.log

          mkdir -p artifacts
          cp -v packages/*.deb artifacts/
          ls -lh artifacts/

      - name: 失败时输出编译日志
        if: failure()
        run: |
          echo "===== 编译日志尾部 ====="
          tail -n 120 /tmp/build.log 2>/dev/null || echo "无日志"

      - name: 上传产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xiugou-${{ matrix.scheme }}
          path: artifacts/*.deb
          if-no-files-found: error
